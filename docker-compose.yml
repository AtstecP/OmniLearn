services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnilearn
      POSTGRES_USER: omnilearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnilearn-local-only}
    ports:
      - "5432:5432"
    volumes:
      - omnilearn-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnilearn -d omnilearn"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://omnilearn:omnilearn-local-only@db:5432/omnilearn}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-this-before-deploying-123456}
      # Local Docker serves plain http; keep the default (true) for HTTPS deployments.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./web
      args:
        # The web server proxies /api/* to this origin over the Compose network.
        API_ORIGIN: ${API_ORIGIN:-http://api:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  omnilearn-db:
