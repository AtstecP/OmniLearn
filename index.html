<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f6f2" />
  <title>OmniLearn — your learning studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-mark">o</span><span>omni<span class="brand-light">learn</span></span></a>
    <div class="workspace-label">YOUR WORKSPACE</div>
    <label class="subject-select-wrap"><span class="subject-dot"></span><select id="subjectSelect" aria-label="Choose subject"></select><span class="chevron">⌄</span></label>
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span>Overview</button>
      <button class="nav-item" data-page="roadmap"><span class="nav-icon">⌁</span>Learning path</button>
      <button class="nav-item" data-page="vocabulary"><span class="nav-icon">▤</span>Vocabulary <span class="nav-count" id="dueCount">0</span></button>
      <button class="nav-item" data-page="readings"><span class="nav-icon">▧</span>Reading room</button>
      <button class="nav-item" data-page="tests"><span class="nav-icon">◉</span>Test center</button>
      <button class="nav-item" data-page="mistakes"><span class="nav-icon">↗</span>Mistake notebook <span class="nav-count muted" id="mistakeCount">0</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="storage-note"><span class="storage-icon">◈</span><div><strong>Your data, your device</strong><small>Saved privately in this browser</small></div></div>
      <button class="profile-button"><span class="avatar">S</span><span class="profile-name">Study space<small>Personal workspace</small></span><span class="more">···</span></button>
    </div>
  </aside>
  <main class="main-area">
    <header class="topbar"><div class="breadcrumb"><span>My workspace</span><span class="slash">/</span><strong id="crumb">Overview</strong></div><div class="top-actions"><button class="icon-button" title="Search" id="searchBtn">⌕</button><button class="icon-button" title="Import data" id="importTop">↥</button><span class="top-divider"></span><span class="today-label" id="todayLabel"></span><span class="avatar small">S</span></div></header>
    <div class="content" id="content"></div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden />
  <script src="app.js"></script>
</body>
</html>
